/* ====================================================================
   Tilly Starlight · fluid adaptive layout · phones / tablets / desktop
   Designed for 320 px–wide phones through large monitor displays.
   ==================================================================== */
:root { --safe-bottom: env(safe-area-inset-bottom, 0px); }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
.app, .workspace, #screen, .page, .topLeft, .topActions,
.statTile, .wordGrid, .wordTile, .profileBanner, .lessonTile,
.pageHeader, .speakingWelcome, .chatWindow, .chatTop,
.chatIdentity, .chatIdentity>div, .msgBubble, .lessonTile .lessonText { min-width:0; }
#screen { width:100%; }
.pageHeader>div:first-child, .speakingWelcome>div:first-child,
.heroText, .statTile>div:last-child { min-width:0; }
.pageHeader h2, .lessonTile h4, .wordTile h4, .profileBanner h3,
.speakTitle { overflow-wrap:break-word; }
/* The star is large, but icons nested inside action buttons must stay small. */
.speakingWelcome > svg { width:165px; height:165px; flex:0 0 165px; }
.speakingWelcome .primary { max-width:100%; min-height:43px; white-space:normal; }
.speakingWelcome .primary svg { width:16px!important; height:16px!important; flex:0 0 16px!important; animation:none!important; }
.topbar, .chatTop, .chatComposer, .chatIdentity { min-width:0; }
.topTitle { overflow-wrap:break-word; }
.chatComposer input, .searchWrap input { min-width:0; }
.sceneCard strong, .sceneCard .sceneEnglish, .homeLesson .copy,
.wordTile p, .msgBubble p { overflow-wrap:break-word; }
button, input, [role=button] { -webkit-tap-highlight-color:transparent; }
@media (hover:none) and (pointer:coarse) {
  .filterChip { min-height:44px; }
  .toolSmall, .roundButton, .wordActions button { min-width:40px; min-height:40px; }
  .suggestion { min-height:42px; }
  .mobileTab { touch-action:manipulation; }
}
@media (min-width:1101px) and (max-width:1350px) {
  .heroText { max-width:60%; }
  .hero h2 { font-size:clamp(30px,3vw,39px); }
  .heroArt { width:43%; }
  .tripleStats { gap:9px; }
}
/* Laptop-sized and narrow desktop windows */
@media (min-width:801px) and (max-width:1100px) {
  .app { grid-template-columns:190px minmax(0,1fr); }
  .sidebar { padding-left:12px; padding-right:12px; }
  .sidebar .logo { padding-left:5px; gap:7px; }
  .sidebar .logoText { font-size:25px; }
  .workspace { padding:25px clamp(18px,2.6vw,28px) 100px; }
  .hero h2 { font-size:clamp(29px,3.9vw,37px); }
  .heroText { max-width:61%; padding-left:clamp(20px,2.5vw,31px); }
  .heroArt { width:43%; right:0; }
  .bubble.first { right:8px; }
  .statTile { padding:13px 10px; }
  .statTile strong { font-size:17px; }
  .scenarioStrip { gap:10px; }
  .sceneCard { min-width:0; }
  .topActions { flex-shrink:0; }
}
/* Touch navigation from tablets down */
@media (max-width:800px) {
  .workspace { width:100%; max-width:760px; margin:0 auto; padding:22px 24px calc(130px + var(--safe-bottom)); }
  .mobileNav {
    left:50%; right:auto; transform:translateX(-50%);
    width:calc(100% - 28px); max-width:720px;
    bottom:calc(12px + var(--safe-bottom)); height:70px;
    padding:7px; border-radius:24px;
    box-shadow:0 16px 46px rgba(49,61,108,.17);
    -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
    transition:transform .25s, opacity .25s;
  }
  .mobileTab { min-width:0; min-height:53px; padding:6px 2px; font-size:10px; line-height:1.15; }
  .mobileTab span { white-space:normal; overflow-wrap:break-word; text-align:center; }
  .mobileTab svg { height:22px; width:22px; }
  .topLeft { flex:1 1 auto; }
  .topActions { flex:0 0 auto; }
  .modalBackdrop { padding: max(12px, env(safe-area-inset-top, 0px)) 12px max(12px, var(--safe-bottom)); }
  .modalCard { width:min(470px,100%); max-height:calc(100dvh - 34px - var(--safe-bottom)); overscroll-behavior:contain; }
  .toast { bottom:calc(98px + var(--safe-bottom)); }
  /* Keyboard-friendly navigation: the dock retreats during text entry. */
  body:has(.chatComposer input:focus) .mobileNav,
  body:has(.searchWrap input:focus) .mobileNav {
    opacity:0; pointer-events:none; transform:translate(-50%,150%);
  }
}

}

function recountStreak(){let d=new Date(),count=0;if(!(state.activity[dateKey()]>0))d.setDate(d.getDate()-1);for(let i=0;i<365;i++){const key=d.toLocaleDateString('en-CA');if(state.activity[key]>0){count++;d.setDate(d.getDate()-1)}else break}state.streak=count}

function wordsPage(){const items=WORDS.filter(w=>(wordFilter==='Барлығы'||w.category===wordFilter)&&(!viewSaved||state.saved.includes(w.id))&&(!wordQuery||w.en.includes(wordQuery)||w.kk.toLowerCase().includes(wordQuery)));return `<section class="page active"><div class="pageHeader"><div><div class="eyebrow">WORD COLLECTION</div><h2>Әр сөз —<br>жаңа әлем. 🌷</h2><p>Ағылшынша тыңда, қазақша аудармасын үйрен, сақта.</p></div><div class="headerIllustration">🗂️</div></div><div class="wordOverview"><div class="wordStat"><strong>${WORDS.length}</strong><span>барлық сөз</span></div><div class="wordStat"><strong>${state.saved.length}</strong><span>сақталған</span></div><div class="wordStat"><strong>5</strong><span>тақырып</span></div></div><div class="flashPromo" style="margin:0 0 16px"><div><h3>Ақылды карточкалар ✨</h3><p>Сөзді аудармасымен салыстыр да, өзіңді сына.</p><button class="primary purple" data-action="flash">Қайталауды бастау ${arrow()}</button></div><span class="flashEmoji">🧠</span></div><label class="searchWrap">${icon('search')}<input id="wordSearch" value="${esc(wordQuery)}" placeholder="Search words / Сөз іздеу..."></label><div class="filterRow">${['Барлығы','Күнделікті','Сезім','Саяхат','Оқу','Жұмыс'].map(c=>`<button class="filterChip ${wordFilter===c?'selected':''}" data-wfilter="${c}">${c}</button>`).join('')}<button class="filterChip ${viewSaved?'selected':''}" data-action="toggleSaved">★ Сақталғандар</button></div><div class="wordGrid" id="wordGrid">${items.length?items.map(wordTile).join(''):'<div class="empty">Іздеу нәтижесі табылмады. Басқа сөз жазып көр.</div>'}</div></section>`}
function wordTile(w){const saved=state.saved.includes(w.id);return `<div class="wordTile"><span class="wordEmoji">${w.emoji}</span><span style="min-width:0;flex:1"><h4>${esc(w.en)}</h4><p>${esc(w.kk)}</p></span><span class="wordActions"><button aria-label="Айтылымын тыңдау" data-say="${esc(w.en)}">${icon('volume')}</button><button class="${saved?'saved':''}" aria-label="${saved?'Сақтаудан алу':'Сақтау'}" data-save="${w.id}">${icon('bookmark')}</button></span></div>`}
function profilePage(){const levelText={A1:'Бастаушы',A2:'Негізгі',B1:'Орта',B2:'Жоғары'};return `<section class="page active"><div class="pageHeader"><div><div class="eyebrow">YOUR LITTLE UNIVERSE</div><h2>Өз жетістігіңмен<br>мақтан! ✨</h2><p>Сенің ағылшын тіліндегі өсу жолың.</p></div><div class="headerIllustration">⭐</div></div><div class="profileBanner"><span class="profPic">🌟</span><div><h3>Future English star</h3><p>Бүгін де өзіңді дамытып жүрсің!</p><span class="levelBadge">${state.level} · ${levelText[state.level]}</span></div></div><div class="profileStats"><div class="profileStat"><strong>🔥 ${state.streak}</strong><small>күн серия</small></div><div class="profileStat"><strong>💎 ${state.xp}</strong><small>тәжірибе XP</small></div><div class="profileStat"><strong>📚 ${state.completed.length}</strong><small>сабақ</small></div></div><div class="panel"><h3 class="panelTitle">🏅 Марапаттарым</h3><div class="badgeGrid">${[['🌱','Алғашқы қадам',state.xp>0],['📖','Білім іздеуші',state.completed.length>=3],['💬','Сөйлесу шебері',state.chatDone.length>=3],['⭐','Жарқыраған жұлдыз',state.xp>=150],['🔥','Үш күн қатар',state.streak>=3],['🏆','Үздік оқушы',state.completed.length>=10]].map(([emoji,label,unlocked])=>`<div class="award ${unlocked?'unlocked':''}"><span>${emoji}</span><strong>${label}</strong><small>${unlocked?'Ашылды':'Құлыптаулы'}</small></div>`).join('')}</div></div><div class="panel"><h3 class="panelTitle">⚙️ Баптаулар</h3><button class="settingRow" data-action="onboard"><div><div class="setName">🎯 Мақсат және деңгей</div><div class="setDesc">Күндік жоспар мен тақырыпты өзгерту</div></div><span class="settingRight">${state.daily} мин · ${state.level} ›</span></button><button class="settingRow" data-action="theme"><div><div class="setName">🌙 Қараңғы режим</div><div class="setDesc">Көзіңе ыңғайлы түсті таңда</div></div><span class="switch ${state.theme==='dark'?'on':''}"></span></button><button class="settingRow" data-action="translate"><div><div class="setName">🇰🇿 Қазақша аударма</div><div class="setDesc">Диалогта аударманы көрсету</div></div><span class="switch ${state.translate?'on':''}"></span></button><button class="settingRow" data-action="reset"><div><div class="setName">↺ Прогресті тазалау</div><div class="setDesc">Сақталған барлық жетістікті өшіру</div></div><span class="settingRight">Қалпына келтіру ›</span></button></div><div class="sectionNote" style="margin-bottom:20px">Tilly Starlight — HTML прототипі. Прогресс осы браузерде сақталады. Тікелей AI-қызметке, аккаунтқа немесе серверге қосылмаған.</div></section>`}
function render(preserveScroll=false){document.body.classList.toggle('dark',state.theme==='dark');const sc=window.scrollY;$('#app').innerHTML=appShell();$('#topDate').textContent=new Date().toLocaleDateString('kk-KZ',{weekday:'long',day:'numeric',month:'long'});renderScreen();if(!preserveScroll)window.scrollTo(0,0);else window.scrollTo(0,sc)}
function renderScreen(){const screens={home,speak:speakPage,learn:learnPage,words:wordsPage,profile:profilePage};$('#screen').innerHTML=screens[state.page]();$('#rightRail').innerHTML=rail();$('#topTitle').textContent=headerTitle();document.querySelectorAll('[data-page]').forEach(e=>e.classList.toggle('active',e.dataset.page===state.page));updateCounters();if(state.page==='speak'&&modalState==='chat'){let el=$('#messages');if(el)el.scrollTop=el.scrollHeight}}
function updateCounters(){const pairs={topStreak:state.streak,topXp:state.xp,homeStreak:state.streak,homeXp:state.xp,homeGoal:dailyPercent()+'%',railPercent:dailyPercent()+'%',railMinutes:activeToday()};Object.entries(pairs).forEach(([k,v])=>{let el=document.getElementById(k);if(el)el.textContent=v});let bar=$('#railBar');if(bar)bar.style.width=dailyPercent()+'%';let week=$('#railWeek');if(week)week.innerHTML=weekHTML()}
function setPage(page){if(!['home','speak','learn','words','profile'].includes(page))return;state.page=page;modalState=null;persist();render()}
function toast(t){let el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),3000)}
function talk(text){if(!('speechSynthesis' in window)){toast('Бұл браузерде дыбыстау қолжетімсіз.');return}try{speechSynthesis.cancel();const ut=new SpeechSynthesisUtterance(text);ut.lang='en-US';ut.rate=.84;ut.pitch=1.08;ut.volume=1;speechSynthesis.speak(ut)}catch{toast('Дыбыстау іске қосылмады.')}}
function confetti(){const e=document.createElement('div');e.className='confetti';for(let i=0;i<35;i++){let b=document.createElement('b');b.style.setProperty('--x',(Math.random()*100)+'%');b.style.setProperty('--c',['#ad93ff','#a5ddff','#ffd76d','#ffabc6','#8becd0'][i%5]);b.style.setProperty('--dur',(2.3+Math.random()*2.2)+'s');b.style.setProperty('--drift',(Math.random()*200-100)+'px');b.style.animationDelay=(Math.random()*.4)+'s';e.append(b)}document.body.append(e);setTimeout(()=>e.remove(),5400)}
function openModal(html){$('#overlayRoot').innerHTML=`<div class="modalBackdrop" id="backdrop"><div class="modalCard" role="dialog" aria-modal="true"><button class="modalClose" data-action="closeModal" aria-label="Жабу">×</button>${html}</div></div>`}
function closeModal(){$('#overlayRoot').innerHTML='';modalState=null}
let onboardStep=0,onboardTmp={level:state.level,goal:state.goal,daily:state.daily};
function openOnboard(){onboardStep=0;onboardTmp={level:state.level,goal:state.goal,daily:state.daily};drawOnboard()}
function drawOnboard(){const data=[{title:'Сәлем, мен Tilly! ⭐',sub:'Сені ағылшынша сенімді сөйлеуге үйретемін. Алдымен деңгейіңді таңдайық.',items:[['A1','Бастапқы'],['A2','Негізгі'],['B1','Орта'],['B2','Жоғары']],key:'level'},{title:'Неге ағылшын үйренесің?',sub:'Саған қызықты әрі пайдалы тақырыптарды ұсынамын.',items:[['Сөйлеуді жақсарту','💬 Еркін сөйлесу'],['Саяхат','✈️ Саяхат жасау'],['Оқу','🎓 Оқу және емтихан'],['Жұмыс','💼 Мансап']],key:'goal'},{title:'Күн сайын неше минут?',sub:'Аздан бастасақ та, тұрақтылық үлкен нәтиже береді.',items:[[5,'⚡ 5 минут'],[10,'🌱 10 минут'],[15,'⭐ 15 минут'],[20,'🚀 20 минут']],key:'daily'}][onboardStep];let val=onboardTmp[data.key];openModal(`<div class="modalArt">${star('190px','wink')}</div><div class="eyebrow" style="margin-top:19px">ҚАДАМ ${onboardStep+1} / 3</div><h2 class="modalTitle">${data.title}</h2><p class="modalSub">${data.sub}</p><div class="optionGrid">${data.items.map(([v,label])=>`<button class="optionBtn ${String(v)===String(val)?'chosen':''}" data-onboard-choose="${esc(v)}">${label}</button>`).join('')}</div><div class="lessonSlides">${[0,1,2].map(i=>`<i class="${i<=onboardStep?'done':''}"></i>`).join('')}</div><button class="primary purple wide" data-action="onboardNext">${onboardStep===2?'Дайын! Жарқырайық ✨':'Жалғастыру'} ${arrow()}</button>`)}
function onboardNext(){if(onboardStep<2){onboardStep++;drawOnboard()}else{state.level=onboardTmp.level;state.goal=onboardTmp.goal;state.daily=Number(onboardTmp.daily);state.onboarded=true;persist();closeModal();render(true);confetti();toast('Мақсатың сақталды. Let’s go! ⭐')}}
let lessonFlow=null;
function startLesson(id){const l=LESSONS.find(x=>x.id===id);if(!l)return;lessonFlow={id,step:0,answer:null,confirmed:false};drawLesson()}
function drawLesson(){const l=LESSONS.find(x=>x.id===lessonFlow.id),step=lessonFlow.step;let inner='';if(step<3){const p=l.phrases[step];inner=`<div class="eyebrow">${l.level} · ЖАҢА ТІРКЕС ${step+1}/3</div><h2 class="modalTitle">${l.emoji} ${l.kk}</h2><p class="modalSub">Тіркесті тыңдап, аудармасын жаттап ал.</p><div class="phraseCard"><p class="phraseEN">${p[0]}</p><p class="phraseKZ">${p[1]}</p><button data-say="${esc(p[0])}">${icon('volume',14)} Айтылымын тыңдау</button></div><p class="feedbackLine">💡 Фразаны дауыстап бірнеше рет қайтала. Тыңдау мен айту есте сақтауға көмектеседі.</p><button class="primary purple wide" data-action="lessonNext">${step===2?'Білімімді тексеру':'Келесі тіркес'} ${arrow()}</button>`}else if(step===3){inner=`<div class="eyebrow">ЖАТТЫҒУ · ${l.level}</div><h2 class="modalTitle">Жауапты тап 🎯</h2><p class="modalSub">${l.question}</p><div class="optionGrid">${l.options.map((v,i)=>`<button class="optionBtn ${lessonFlow.confirmed?(i===l.correct?'correct':i===lessonFlow.answer?'wrong':''):lessonFlow.answer===i?'chosen':''}" data-lesson-answer="${i}" ${lessonFlow.confirmed?'disabled':''}>${String.fromCharCode(65+i)}. ${v}</button>`).join('')}</div>${lessonFlow.confirmed?`<p class="feedbackLine">${lessonFlow.answer===l.correct?'✅ Дұрыс!':'💡 Дұрыс жауап: '+l.options[l.correct]}<br>${l.note}</p>`:''}<button class="primary purple wide" data-action="lessonNext" ${!lessonFlow.confirmed?'disabled':''}>${lessonFlow.confirmed?'Сабақты аяқтау ✨':'Алдымен жауапты таңда'} ${arrow()}</button>`}else{const done=state.completed.includes(l.id);inner=`<div class="modalArt">${star('190px','wink')}</div><h2 class="modalTitle">You did it! 🎉</h2><p class="modalSub">«${l.kk}» сабағын аяқтадың. ${done?'Бұл сабақты қайта қайталадың.':'+35 XP қосылды!'} Әр жетістік маңызды.</p><button class="primary purple wide" data-action="closeModal">Өте жақсы! ${arrow()}</button>`}
openModal(`<div class="lessonSlides">${[0,1,2,3].map(i=>`<i class="${i<=Math.min(step,3)?'done':''}"></i>`).join('')}</div>${inner}`)}
function lessonNext(){if(!lessonFlow)return;const l=LESSONS.find(x=>x.id===lessonFlow.id);if(lessonFlow.step===3){if(!lessonFlow.confirmed)return;if(!state.completed.includes(l.id)){state.completed.push(l.id);gain(35,l.mins);confetti()}lessonFlow.step=4;drawLesson();renderScreen();return}lessonFlow.step++;drawLesson()}
function chooseLessonAnswer(index){if(!lessonFlow||lessonFlow.confirmed)return;lessonFlow.answer=index;lessonFlow.confirmed=true;drawLesson();if(index===LESSONS.find(x=>x.id===lessonFlow.id).correct)talk('Excellent!')}
function startChat(id){selectedScene=id;chatLog=[];chatRound=0;chatFinished=false;modalState='chat';state.page='speak';persist();render();const s=SCENES.find(x=>x.id===id);setTimeout(()=>{if(state.page==='speak'&&modalState==='chat')talk(s.rounds[0][0])},220)}
function sendChat(){let input=$('#chatInput');if(!input)return;const text=input.value.trim();if(!text){toast('Алдымен ағылшынша жауап жаз 😊');return}if(text.length>450){toast('Жауап тым ұзақ. Қысқартып көр.');return}const scene=SCENES.find(x=>x.id===selectedScene),r=scene.rounds[chatRound],sample=r[2];chatLog.push({who:'user',en:text});const clean=str=>str.toLowerCase().replace(/[^a-z\s]/g,'').split(/\s+/).filter(Boolean);const sampleTerms=clean(sample).filter(x=>x.length>3&&!['would','please','there','that','have','with','this'].includes(x)),userTerms=clean(text);const match=sampleTerms.filter(x=>userTerms.includes(x)).length/Math.max(1,sampleTerms.length);if(match<.45){chatLog.push({who:'feedback',title:'Үлгі жауап',text:`Мынадай түрде де айтуға болады: “${sample}”. Өз жауабыңды үлгімен салыстыр.`})}else{chatLog.push({who:'feedback',title:'Жақсы қадам! ⭐',text:'Жауабың берілген үлгіге ұқсайды. Енді келесі сұраққа өтейік.'})}state.messages++;chatRound++;if(chatRound>=scene.rounds.length){chatFinished=true;if(!state.chatDone.includes(scene.id)){state.chatDone.push(scene.id);gain(45,5);confetti();toast('Диалог аяқталды! +45 XP 🎉')}else{gain(5,2);toast('Диалогты қайталап шықтың! ⭐')}}else{chatLog.push({who:'bot',en:scene.rounds[chatRound][0],kk:scene.rounds[chatRound][1]})}persist();renderScreen();let inp=$('#chatInput');if(inp)inp.focus()}
function hint(){const s=SCENES.find(x=>x.id===selectedScene);const phrase=s.rounds[Math.min(chatRound,s.rounds.length-1)][2];const inp=$('#chatInput');if(inp){inp.value=phrase;inp.focus();toast('Үлгі сөйлем енгізілді. Өзгертіп көр!')}}
function startMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Бұл браузерде сөйлеуді тану қолжетімсіз. Chrome қолданып көр.');return}if(isListening)return;try{const rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.continuous=false;isListening=true;const b=$('[data-action="mic"]');if(b)b.classList.add('listening');rec.onresult=e=>{const inp=$('#chatInput');if(inp)inp.value=e.results[0][0].transcript;toast('Дауыс танылды! Тексеріп, жібер. 🎙️')};rec.onerror=e=>toast(e.error==='not-allowed'?'Микрофонға рұқсат берілмеді.':'Микрофон іске қосылмады.');rec.onend=()=>{isListening=false;const btn=$('[data-action="mic"]');if(btn)btn.classList.remove('listening')};rec.start();toast('Ағылшынша сөйлеп көр 🎙️')}catch{isListening=false;toast('Микрофон іске қосылмады.')}}
function toggleSaved(id){if(state.saved.includes(id))state.saved=state.saved.filter(x=>x!==id);else state.saved.push(id);persist();renderScreen();toast(state.saved.includes(id)?'Сөз сақталды ⭐':'Сақталғандардан алынды')}
function startFlash(){flashList=WORDS.filter(w=>state.saved.includes(w.id));if(!flashList.length)flashList=WORDS.slice(0,7);flashIndex=0;flashFlipped=false;drawFlash()}
function drawFlash(){const w=flashList[flashIndex];openModal(`<div class="eyebrow">SMART FLASHCARDS · ${flashIndex+1}/${flashList.length}</div><h2 class="modalTitle">Сөзді есіңе түсір 🧠</h2><p class="modalSub">Карточканы басып, қазақша аудармасын аш.</p><button class="flashCard" data-action="flip"><span class="fcEmoji">${w.emoji}</span><strong>${flashFlipped?esc(w.kk):esc(w.en)}</strong><small>${flashFlipped?'Аудармасы · Қазақша':'Tap to flip · Аударманы көру'}</small></button><div class="flashFooter"><button class="roundButton" data-say="${esc(w.en)}" title="Тыңдау">${icon('volume')}</button><button class="primary purple" data-action="flashNext">${flashIndex===flashList.length-1?'Аяқтау ✨':'Келесі сөз'} ${arrow()}</button></div>`)}
function flashNext(){if(flashIndex===flashList.length-1){gain(15,3);confetti();closeModal();toast('Керемет! +15 XP ⭐')}else{flashIndex++;flashFlipped=false;drawFlash()}}
let quickTest=null;
function startQuickQuiz(){const day=new Date().getDate(),pool=LESSONS.slice();pool.push(...pool.splice(0,day%pool.length));quickTest={list:pool.slice(0,5),index:0,choice:null,confirmed:false,score:0};drawQuickQuiz()}
function drawQuickQuiz(){if(!quickTest)return;const q=quickTest.list[quickTest.index];openModal(`<div class="eyebrow">QUICK PRACTICE · ${quickTest.index+1}/5</div><h2 class="modalTitle">5 минуттық тест 🧩</h2><p class="modalSub">${q.question}</p><div class="lessonSlides">${[0,1,2,3,4].map(i=>`<i class="${i<=quickTest.index?'done':''}"></i>`).join('')}</div><div class="optionGrid">${q.options.map((o,i)=>`<button class="optionBtn ${quickTest.confirmed?(i===q.correct?'correct':i===quickTest.choice?'wrong':''):''}" data-quiz-answer="${i}" ${quickTest.confirmed?'disabled':''}>${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>${quickTest.confirmed?`<p class="feedbackLine">${quickTest.choice===q.correct?'✅ Дұрыс жауап!':'💡 Дұрыс жауап: '+q.options[q.correct]}<br>${q.note}</p>`:''}<button class="primary purple wide" data-action="quickQuizNext" ${quickTest.confirmed?'':'disabled'}>${quickTest.index===4?'Нәтижені көру':'Келесі сұрақ'} ${arrow()}</button>`)}
function quizAnswer(n){if(!quickTest||quickTest.confirmed)return;quickTest.choice=n;quickTest.confirmed=true;if(n===quickTest.list[quickTest.index].correct)quickTest.score++;drawQuickQuiz()}
function quickQuizNext(){if(!quickTest||!quickTest.confirmed)return;if(quickTest.index<4){quickTest.index++;quickTest.choice=null;quickTest.confirmed=false;drawQuickQuiz()}else{const done=state.quizDates.includes(dateKey());if(!done){state.quizDates.push(dateKey());gain(25,5);confetti()}openModal(`<div class="modalArt">${star('190px','wink')}</div><div class="eyebrow" style="margin-top:17px">TEST COMPLETE</div><h2 class="modalTitle">${quickTest.score}/5 дұрыс жауап! 🎉</h2><p class="modalSub">${quickTest.score>=4?'Тамаша! Білімің керемет.':'Жақсы бастама! Қате кеткен тақырыптарды қайталап көр.'} ${done?'Бүгінгі бонус бұрын берілген.':'Бүгінгі тест үшін +25 XP қосылды!'}</p><button class="primary purple wide" data-action="closeModal">Жарайсың! ✨</button>`);quickTest=null}}
function resetProgress(){openModal(`<div class="modalArt">${star('180px')}</div><h2 class="modalTitle">Прогресті тазалаймыз ба?</h2><p class="modalSub">XP, аяқталған сабақтар, чат жетістіктері мен сақталған сөздер қалпына келеді. Бұл әрекетті қайтару мүмкін емес.</p><div class="optionGrid"><button class="optionBtn" data-action="closeModal">Болдырмау</button><button class="optionBtn" style="background:#ffe7ea;color:#bc4e63" data-action="confirmReset">Иә, тазалау</button></div>`)}
function handleClick(e){const target=e.target.closest('[data-action],[data-page],[data-scene],[data-lesson],[data-onboard-choose],[data-lesson-answer],[data-suggest],[data-sfilter],[data-wfilter],[data-save],[data-say],[data-quiz-answer]');if(!target){if(e.target.id==='backdrop')closeModal();return}if(target.dataset.page){setPage(target.dataset.page);return}if(target.dataset.scene){startChat(target.dataset.scene);return}if(target.dataset.lesson){startLesson(target.dataset.lesson);return}if(target.hasAttribute('data-say')){talk(target.dataset.say);return}if(target.hasAttribute('data-save')){toggleSaved(Number(target.dataset.save));return}if(target.hasAttribute('data-suggest')){const i=$('#chatInput');if(i){i.value=target.dataset.suggest;i.focus()}return}if(target.hasAttribute('data-sfilter')){scenarioFilter=target.dataset.sfilter;renderScreen();return}if(target.hasAttribute('data-wfilter')){wordFilter=target.dataset.wfilter;renderScreen();return}if(target.hasAttribute('data-onboard-choose')){onboardTmp[['level','goal','daily'][onboardStep]]=target.dataset.onboardChoose;drawOnboard();return}if(target.hasAttribute('data-lesson-answer')){chooseLessonAnswer(Number(target.dataset.lessonAnswer));return}if(target.hasAttribute('data-quiz-answer')){quizAnswer(Number(target.dataset.quizAnswer));return}
const action=target.dataset.action;if(!action)return;switch(action){case'quickQuiz':startQuickQuiz();break;case'quickQuizNext':quickQuizNext();break;case'quickChat':case'startSelected':startChat(selectedScene);break;case'backScenes':modalState=null;chatLog=[];render();break;case'restartChat':startChat(selectedScene);break;case'hint':hint();break;case'mic':startMic();break;case'translate':state.translate=!state.translate;persist();renderScreen();toast(state.translate?'Аударма қосылды 🇰🇿':'Аударма жасырылды');break;case'theme':state.theme=state.theme==='dark'?'light':'dark';persist();render(true);break;case'onboard':openOnboard();break;case'onboardNext':onboardNext();break;case'closeModal':closeModal();break;case'lessonNext':lessonNext();break;case'flash':startFlash();break;case'flip':flashFlipped=!flashFlipped;drawFlash();break;case'flashNext':flashNext();break;case'toggleSaved':viewSaved=!viewSaved;renderScreen();break;case'reset':resetProgress();break;case'confirmReset':{const oldTheme=state.theme;state={...defaults,theme:oldTheme};persist();closeModal();modalState=null;render();toast('Демо прогресс тазаланды');break}}
}
document.addEventListener('click',handleClick);
document.addEventListener('submit',e=>{if(e.target.id==='chatForm'){e.preventDefault();sendChat()}});
document.addEventListener('input',e=>{if(e.target.id==='wordSearch'){wordQuery=e.target.value.toLowerCase();const cards=WORDS.filter(w=>(wordFilter==='Барлығы'||w.category===wordFilter)&&(!viewSaved||state.saved.includes(w.id))&&(!wordQuery||w.en.includes(wordQuery)||w.kk.toLowerCase().includes(wordQuery)));let el=$('#wordGrid');if(el)el.innerHTML=cards.length?cards.map(wordTile).join(''):'<div class="empty">Іздеу нәтижесі табылмады.</div>'}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#overlayRoot').children.length)closeModal()});
recountStreak();render();
</script>
</body>
</html>
